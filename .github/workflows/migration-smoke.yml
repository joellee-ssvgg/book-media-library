name: migration-smoke

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
    paths:
      - "supabase/**"
      - ".github/workflows/migration-smoke.yml"
  pull_request:

jobs:
  migration-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.98.2
      - run: supabase start
      - run: supabase db reset
